# =============================================================================
# k8s/secret.yaml — SECRET TEMPLATE
# =============================================================================
# DO NOT commit real values.
# Replace every <base64:...> with the base64-encoded real value:
#   echo -n 'mysecret' | base64
#
# Apply with:
#   kubectl apply -f k8s/secret.yaml -n cortex
# =============================================================================
apiVersion: v1
kind: Secret
metadata:
  name: cortex-secrets
  namespace: cortex
  labels:
    app.kubernetes.io/name: cortex
    app.kubernetes.io/component: secret
type: Opaque
data:
  # PostgreSQL password (base64-encoded)
  POSTGRES_PASSWORD: "<base64:CHANGE_ME>"

  # Redis password (base64-encoded, leave empty string "" if no auth)
  REDIS_PASSWORD: "<base64:CHANGE_ME>"

  # JWT signing secret — minimum 32 chars, generate with:
  #   python -c "import secrets; print(secrets.token_hex(32))"
  JWT_SECRET_KEY: "<base64:CHANGE_ME>"

  # Google Gemini API key (base64-encoded, or leave as "" to disable LLM)
  GEMINI_API_KEY: "<base64:CHANGE_ME>"
