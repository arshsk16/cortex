# Kustomize base — apply all manifests in dependency order.
# Usage:
#   kubectl apply -k k8s/
#
# Or apply individual directories:
#   kubectl apply -f k8s/namespace.yaml
#   kubectl apply -f k8s/configmap.yaml
#   kubectl apply -f k8s/secret.yaml        # fill in real values first!
#   kubectl apply -f k8s/postgres/
#   kubectl apply -f k8s/redis/
#   kubectl apply -f k8s/cortex/
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: cortex
resources:
  - namespace.yaml
  - configmap.yaml
  - secret.yaml
  - postgres/statefulset.yaml
  - postgres/service.yaml
  - redis/pvc.yaml
  - redis/deployment.yaml
  - redis/service.yaml
  - cortex/pvc.yaml
  - cortex/deployment.yaml
  - cortex/service.yaml
  - cortex/hpa.yaml
  - cortex/ingress.yaml
